name: streamify
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: streamify_owner
      POSTGRES_DB: streamify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamify_owner -d streamify"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-bookworm
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build: { context: ., target: development }
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://streamify_owner:${POSTGRES_PASSWORD}@db:5432/streamify
      MIGRATION_DATABASE_URL: postgresql://streamify_owner:${POSTGRES_PASSWORD}@db:5432/streamify
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    depends_on:
      db: { condition: service_healthy }
  app:
    build: { context: ., target: development }
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      NODE_ENV: development
      DATABASE_URL: postgresql://streamify_app:${APP_DATABASE_PASSWORD}@db:5432/streamify
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
volumes:
  postgres_data:
